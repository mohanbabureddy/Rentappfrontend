server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so every path that isn't an
    # actual built file (e.g. /login, /admin/dashboard, a page refresh, or a
    # bookmarked link) must still be served index.html -- otherwise nginx's
    # default behaviour 404s on anything but the exact files it built.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
